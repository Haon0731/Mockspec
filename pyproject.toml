[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-spec"
version = "0.1.0"
description = "Reviewed MockBench inputs and evidence-linked scenario inference"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.14.1,<3", "openai-agents==0.24.0"]

[project.scripts]
mock-spec-scenario = "mock_spec.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mock_spec = ["reviewed_inputs.json", "prompts/*.txt", "tools/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_data: read-only integration with externally stored MockBench snapshots"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.mypy]
python_version = "3.10"
files = ["src/mock_spec"]
